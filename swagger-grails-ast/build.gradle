plugins {
    id "war"
    id "idea"
    id "eclipse"
    id 'maven-publish'
    id 'java-library'
    id 'groovy'
}

version "0.6.0"
group "org.apache.grails"

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:4.0.28'
    implementation 'org.slf4j:slf4j-api:2.0.17'
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}